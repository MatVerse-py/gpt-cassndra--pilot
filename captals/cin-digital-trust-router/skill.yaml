name: cin-digital-trust-router
version: 1.0.0
status: sandbox-hardened
scope: captals-trust-primitive
description: >
  Camada de confiança para validação autorizada com privacidade, ledger encadeado e replay.
  Não emite documento e não afirma assurance oficial sem conector autorizado.

capabilities:
  - ephemeral_session_salt
  - atomic_one_time_salt_consumption
  - cpf_format_validation_in_memory
  - audit_token_hashing
  - blind_logging
  - tamper_evident_audit_ledger
  - trust_response_schema
  - sandbox_wallet_demo

allowed:
  - validate authorized input
  - create trust response
  - record sanitized evidence
  - hold execution when official assurance is unavailable

blocked:
  - issue official identity document
  - generate usable government QR
  - forge public authority signature
  - bypass gov.br or biometric systems
  - persist raw personal identifier

gates:
  PASS:
    - official connector authorized
    - signature and certificate chain verified
    - issuer and status confirmed
    - no sensitive identifier persisted
    - schema and ledger evidence valid
  HOLD:
    - sandbox execution
    - official connector missing
    - partial or unavailable assurance
  BLOCK:
    - document generation attempt
    - auth bypass attempt
    - raw identifier persistence attempt
    - untrusted issuer
  ESCALATE:
    - legal ambiguity
    - suspected fraud
    - audit incident

entrypoints:
  http:
    health: /health
    demo: /demo/
    session: /api/session/start
    validate: /api/cin/validate

artifacts:
  - README.md
  - package.json
  - Dockerfile
  - docker-compose.yml
  - scripts/verify-ledger.js
  - src/index.js
  - src/lib/session-manager.js
  - src/lib/trust-engine.js
  - src/lib/log-sanitizer.js
  - src/lib/audit-store.js
  - schemas/cin-trust-response.schema.json
  - schemas/audit-event.schema.json
  - policies/allowed.policy.json
  - policies/blocked.policy.json
