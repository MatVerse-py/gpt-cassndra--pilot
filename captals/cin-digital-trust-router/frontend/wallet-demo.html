<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIN Digital Trust Router Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    section { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    label { display: block; margin-top: 12px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #020617; color: #e2e8f0; }
    button { margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; background: #38bdf8; color: #082f49; font-weight: 800; cursor: pointer; }
    pre { white-space: pre-wrap; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 12px; overflow: auto; }
    .warn { color: #fbbf24; }
  </style>
</head>
<body>
  <main>
    <h1>CIN Digital Trust Router</h1>
    <p class="warn">Sandbox demonstrativo. Não emite documento, não cria QR oficial, não substitui gov.br.</p>

    <section>
      <h2>1. Criar sessão efêmera</h2>
      <button id="sessionButton">Criar sessão</button>
      <pre id="sessionOut">sem sessão</pre>
    </section>

    <section>
      <h2>2. Validar formato e confiança</h2>
      <label for="sessionId">Session ID</label>
      <input id="sessionId" placeholder="cole o sessionId" />
      <label for="cpf">CPF</label>
      <input id="cpf" placeholder="000.000.000-00" autocomplete="off" />
      <label for="issuerState">UF emissora</label>
      <input id="issuerState" value="SP" maxlength="2" />
      <button id="validateButton">Validar</button>
      <pre id="validateOut">sem validação</pre>
    </section>
  </main>

  <script>
    const api = 'http://localhost:3001';
    const sessionButton = document.getElementById('sessionButton');
    const validateButton = document.getElementById('validateButton');
    const sessionOut = document.getElementById('sessionOut');
    const validateOut = document.getElementById('validateOut');
    const sessionIdInput = document.getElementById('sessionId');
    const cpfInput = document.getElementById('cpf');

    sessionButton.onclick = async () => {
      const res = await fetch(`${api}/api/session/start`, { method: 'POST' });
      const data = await res.json();
      sessionIdInput.value = data.sessionId;
      sessionOut.textContent = JSON.stringify(data, null, 2);
    };

    validateButton.onclick = async () => {
      const payload = {
        sessionId: sessionIdInput.value,
        cpf: cpfInput.value,
        issuerState: document.getElementById('issuerState').value.toUpperCase()
      };
      const res = await fetch(`${api}/api/cin/validate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      cpfInput.value = '';
      validateOut.textContent = JSON.stringify(data, null, 2);
    };
  </script>
</body>
</html>
