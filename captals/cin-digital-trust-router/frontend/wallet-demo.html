<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>CIN Digital Trust Router Demo</title>
  <link rel="stylesheet" href="/demo/wallet-demo.css" />
</head>
<body>
  <main>
    <h1>CIN Digital Trust Router</h1>
    <p class="warn">Sandbox demonstrativo. A resposta mantém gate HOLD até existir conector oficial e assurance verificável.</p>

    <section>
      <h2>1. Criar sessão efêmera</h2>
      <button id="sessionButton" type="button">Criar sessão</button>
      <pre id="sessionOut" aria-live="polite">sem sessão</pre>
    </section>

    <section>
      <h2>2. Validar formato e confiança</h2>
      <label for="sessionId">Session ID</label>
      <input id="sessionId" placeholder="crie uma sessão antes" autocomplete="off" />
      <label for="cpf">CPF</label>
      <input id="cpf" placeholder="somente ambiente autorizado" inputmode="numeric" autocomplete="off" />
      <label for="issuerState">UF emissora</label>
      <input id="issuerState" value="SP" maxlength="2" autocomplete="off" />
      <button id="validateButton" type="button">Validar</button>
      <pre id="validateOut" aria-live="polite">sem validação</pre>
    </section>
  </main>

  <script src="/demo/wallet-demo.js" defer></script>
</body>
</html>
